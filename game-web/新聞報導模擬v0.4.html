<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>新聞報導呈現模擬 v0.4</title>
<style>
  :root {
    --navy: #0C1A28; --panel: #172B40cc; --rim: #254663;
    --amber: #F0A020; --text: #D4E6F4; --lo: #5E84A4;
    --ui: system-ui, -apple-system, 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:#0a1420; font-family:var(--ui); color:var(--text); }
  body { display:flex; gap:16px; padding:16px; align-items:flex-start; }

  #panel { flex:0 0 250px; background:#132437; border:1px solid var(--rim); border-radius:12px; padding:15px; font-size:13px; }
  #panel h1 { font-size:15px; margin:0 0 10px; color:var(--amber); }
  #panel label { display:block; margin:11px 0 4px; color:var(--lo); font-size:12px; }
  #panel button {
    width:100%; margin:3px 0; padding:7px; border-radius:8px; cursor:pointer;
    background:linear-gradient(#355f77,#1b374b); color:#fff; border:2px solid #5fa1c2;
    font-family:var(--ui); font-size:12.5px;
  }
  #panel button.on { border-color:var(--amber); background:rgba(240,160,32,.22); }
  #panel input[type=range] { width:100%; }
  #panel .val { color:var(--amber); font-weight:700; }
  #panel hr { border:0; border-top:1px solid var(--rim); margin:12px 0; }
  #readout { margin-top:11px; padding:8px 10px; background:#0e1d2c; border:1px solid var(--rim);
             border-radius:8px; font-size:11.5px; line-height:1.7; }
  #note { margin-top:10px; font-size:11.5px; color:var(--lo); line-height:1.6; }
  #note b { color:var(--text); }

  #stage-wrap { flex:1 1 auto; display:flex; justify-content:center; }
  #stage {
    position:relative; overflow:hidden; border-radius:14px; border:1px solid var(--rim);
    background:#1d3a52 url('assets/map_bg.svg') center/cover no-repeat;
    box-shadow:0 18px 50px rgba(0,0,0,.55);
  }

  /* 遊戲本體的實際擺設（位置與尺寸照抄，含窄螢幕 ≤700px 的縮小規則） */
  .g-hud {
    position:absolute; top:14px; left:14px; z-index:10; max-width:52%;
    background:var(--panel); border:1px solid var(--rim); border-radius:10px;
    padding:12px 14px; font-size:13px; line-height:1.65;
  }
  .g-hud b { color:var(--amber); }
  .g-btns { position:absolute; top:14px; right:14px; z-index:70; display:flex; gap:4px; }
  .g-btns span {
    width:40px; height:40px; border-radius:50%; font-size:17px;
    background:var(--panel); border:1px solid var(--rim);
    display:flex; align-items:center; justify-content:center;
  }
  .g-ctrl { position:absolute; left:20px; bottom:20px; z-index:10; display:flex; gap:12px; }
  .g-ctrl div {
    background:linear-gradient(#355f77,#1b374b); border:2px solid #5fa1c2; color:#fff;
    border-radius:22px; padding:0 20px; height:44px; display:flex; align-items:center;
    font-size:13px; font-weight:700;
  }
  .g-ctrl.hidden { opacity:.25; }
  .g-mini {
    position:absolute; right:14px; bottom:14px; z-index:10; width:150px; height:190px;
    border:1px solid var(--rim); border-radius:8px; background:rgba(17,38,59,.8);
    display:flex; align-items:center; justify-content:center; color:var(--lo); font-size:11px;
  }
  #stage.narrow .g-btns { top:8px; right:8px; }
  #stage.narrow .g-btns span { width:32px; height:32px; font-size:14px; }
  #stage.narrow .g-mini { right:8px; bottom:8px; width:120px; height:150px; }
  #stage.narrow .g-hud { font-size:11.5px; padding:8px 10px; top:8px; left:8px; }
  #stage.narrow .g-ctrl { left:8px; bottom:8px; }
  #stage.narrow .g-ctrl div { height:40px; padding:0 16px; font-size:11px; }

  /* ── 新聞快報 ──
     改成「按 A 繼續」之後這不再是純演出，而是一個要人關掉的面板：
     持 token 的那台按 A 才收掉，其他人只能看。
     仍然保留 pointer-events:none —— 遊戲本身的擲骰／卡片鈕在這段時間本來就該是
     不能按的（等這個人按繼續），不需要靠這張卡去擋，讓它擋反而會蓋掉靜音鈕。 */
  #news { position:absolute; z-index:40; pointer-events:none; opacity:0; }
  #news.in { animation:newsIn .55s cubic-bezier(.22,.9,.32,1) forwards; }
  #news.out { animation:newsOut .4s ease-in forwards; }
  @keyframes newsIn  { from { opacity:0; transform:translateX(115%); } to { opacity:1; transform:translateX(0); } }
  @keyframes newsOut { from { opacity:1; transform:translateX(0); } to { opacity:0; transform:translateX(115%); } }
  #news .wrap { filter:drop-shadow(0 10px 30px rgba(0,0,0,.65)); }
  #news img {
    display:block; width:100%; height:auto; border-radius:10px 10px 0 0;
    border:2px solid rgba(255,255,255,.75); border-bottom:none;
  }
  #news .cap {
    background:rgba(12,26,40,.94); border:2px solid rgba(255,255,255,.75); border-top:none;
    border-radius:0 0 10px 10px; padding:10px 12px; text-align:center;
  }
  /* 橫式版型：插圖是 1:1，直式在寬螢幕上高度會吃掉太多，改成圖左字右 */
  #news.side .wrap { display:flex; align-items:stretch; height:100%; }
  #news.side img { width:auto; height:100%; flex:0 0 auto; border-radius:10px 0 0 10px;
                   border-right:none; border-bottom:2px solid rgba(255,255,255,.75); }
  #news.side .cap { border-radius:0 10px 10px 0; border-top:2px solid rgba(255,255,255,.75);
                    border-left:none; flex:1 1 auto; min-width:0;
                    display:flex; flex-direction:column; align-items:center; justify-content:center; }
  #news .line { color:#fff; font-weight:700; line-height:1.5; }
  #news .l { white-space:nowrap; }   /* 每行不折行；折了就是字太長，改文案而不是讓它拆詞 */
  #news .who  { color:var(--amber); }
  #news .goal { color:#ffd36b; }
  #news .nb   { white-space:nowrap; }
  /* 「按 A 繼續」提示：跟到站慶祝、年度結算用同一套語氣 */
  /* 提示列是整張卡唯一可以點的地方。手機沒有鍵盤，不能只靠按 A；
     其餘部分維持 pointer-events:none，才不會蓋掉右上角的靜音鈕。 */
  #news .go {
    margin-top:8px; padding-top:7px; border-top:1px dashed rgba(255,255,255,.25);
    color:var(--amber); font-weight:700; animation:blink 1.1s ease-in-out infinite;
    pointer-events:auto; cursor:pointer;
  }
  #news .wait { margin-top:8px; padding-top:7px; border-top:1px dashed rgba(255,255,255,.25);
                color:var(--lo); font-weight:400; }
  @keyframes blink { 0%,100% { opacity:1 } 50% { opacity:.45 } }
</style>
</head>
<body>

<div id="panel">
  <h1>📺 新聞報導呈現模擬 v0.4</h1>

  <label>稱號（六種）</label>
  <button data-t="0" class="on">夜市大亨・夜市</button>
  <button data-t="1">經營之神・公司</button>
  <button data-t="2">農業冠軍・農村</button>
  <button data-t="3">國家公園守護者・國家公園</button>
  <button data-t="4">優良工廠・工廠</button>
  <button data-t="5">神威顯赫・寺廟</button>

  <hr>
  <label>文案語氣</label>
  <button data-c="anchor" class="on">主播口氣（我寫的）</button>
  <button data-c="plain">簡潔版（你原本那句）</button>

  <hr>
  <label>看的人是誰</label>
  <button data-v="me" class="on">操作者（按 A 繼續）</button>
  <button data-v="other">其他玩家（只能看）</button>

  <hr>
  <label>畫面尺寸</label>
  <button data-s="390x844" class="on">手機直式 390×844</button>
  <button data-s="844x390">手機橫式 844×390</button>
  <button data-s="1280x800">電腦 1280×800</button>

  <hr>
  <label>卡片寬度 <span class="val" id="wv">72</span>% 畫面寬</label>
  <input type="range" id="w" min="40" max="92" value="72">

  <hr>
  <button id="replay" style="border-color:var(--amber)">▶ 重新播放進場</button>
  <button id="press">🅐 模擬按下 A（收掉）</button>

  <div id="readout"></div>
  <div id="note">
    已改成 <b>按 A 繼續</b>，不自動消失。<br>
    小地圖不再納入避讓計算。<br><br>
    <b>門檻不是一律一百萬</b> —— 各類型「買滿一站」的年收差到 90 倍
    （夜市 420萬、寺廟 37050萬），共用同一個數字的話夜市買一攤就達標了。
    這裡先各給一個暫定值，數字你再定。
  </div>
</div>

<div id="stage-wrap">
  <div id="stage" class="narrow" style="width:390px;height:844px">
    <div class="g-hud">
      第 1 年　3 月　<b>🎮 有控制權</b><br>
      🚩 目的地：新左營（28）<br>
      探險家　<b>💰 320萬</b>　🃏2/8
    </div>
    <div class="g-btns"><span>👋</span><span>⚙️</span><span>❓</span><span>🔊</span></div>

    <div id="news"><div class="wrap">
      <img id="news-img" src="assets/news/夜市大亨.jpg" alt="新聞報導">
      <div class="cap">
        <div class="line" id="copy"></div>
        <div id="prompt"></div>
      </div>
    </div></div>

    <div class="g-ctrl" id="ctrl"><div>🎲 探險家 擲骰</div><div>🃏 卡片</div></div>
    <div class="g-mini">小地圖</div>
  </div>
</div>

<script>
  const P = '探險家';           // 玩家名字（示意）
  const TITLES = [
    {name:'夜市大亨',       img:'夜市大亨.jpg',       type:'夜市',     goal:1500,  verb:'榮登',
     lead:'香味飄了三條街！',   body:'電鐵的夜市大排長龍，'},
    {name:'經營之神',       img:'經營之神.jpg',       type:'公司',     goal:3500,  verb:'榮登',
     lead:'企業界震撼消息！',   body:'電鐵的公司獲利飆升，'},
    {name:'農業冠軍',       img:'農業冠軍.jpg',       type:'農村',     goal:7500,  verb:'榮登',
     lead:'今年大豐收！',       body:'電鐵的田裡結實纍纍，'},
    {name:'國家公園守護者', img:'國家公園守護者.jpg', type:'國家公園', goal:68000, verb:'榮登',
     lead:'山林傳來好消息！',   body:'電鐵用心守護山林，'},
    {name:'優良工廠',       img:'優良工廠.jpg',       type:'工廠',     goal:3500,  verb:'榮獲',
     lead:'生產線全開！',       body:'電鐵的工廠品質一流，'},
    {name:'神威顯赫',       img:'神威顯赫.jpg',       type:'寺廟',     goal:74000, verb:'榮獲',
     lead:'香火鼎盛！',         body:'電鐵的廟埕人潮不斷，'},
  ];
  const money = n => n >= 10000 ? (n % 10000 ? (n/10000).toFixed(1) : n/10000) + '億' : n + '萬';
  const anchorOf = t => `<div class="l">${t.lead}</div>`
      + `<div class="l"><span class="who">${P}</span> ${t.body}</div>`
      + `<div class="l">年<span class="goal nb">收入突破${money(t.goal)}</span>——</div>`
      + `<div class="l">恭喜${t.verb} <span class="who nb">${t.name}</span>！</div>`;
  const plainOf = t => `<div class="l">恭喜 <span class="who">${P}</span> 電鐵</div>`
      + `<div class="l">成為<span class="who nb">${t.name}</span>！</div>`
      + `<div class="l">達成<span class="goal nb">年收入${money(t.goal)}</span>目標</div>`
      + `<div class="l" style="font-weight:400;opacity:.85">請繼續努力！</div>`;

  const stage = document.getElementById('stage'), news = document.getElementById('news');
  const wR = document.getElementById('w');
  let ti = 0, copyMode = 'anchor', view = 'me';

  function render() {
    const t = TITLES[ti];
    document.getElementById('news-img').src = 'assets/news/' + t.img;
    document.getElementById('copy').innerHTML = copyMode === 'anchor' ? anchorOf(t) : plainOf(t);
    document.getElementById('prompt').className = view === 'me' ? 'go' : 'wait';
    document.getElementById('prompt').innerHTML = view === 'me'
      ? '按 A ／空白鍵繼續'
      : `等 <span style="color:var(--amber)">${P}</span> 按繼續⋯`;
    // 其他玩家在這段時間本來就不能動，把擲骰／卡片鈕壓暗表示不可用
    document.getElementById('ctrl').classList.toggle('hidden', view === 'other');
    apply();
  }

  function apply() {
    const w = +wR.value;
    document.getElementById('wv').textContent = w;
    const narrow = stage.clientWidth <= 700;
    stage.classList.toggle('narrow', narrow);
    const edge = narrow ? 8 : 14;
    const btnBottom = (narrow ? 8 + 32 : 14 + 40) + 6;      // 讓開右上那排圓鈕
    const side = stage.clientWidth / stage.clientHeight > 1.3;
    news.classList.toggle('side', side);

    // 小地圖不再納入計算（使用者說不用管），只留「讓開圓鈕」與「不超出畫面」
    const avail = stage.clientHeight - btnBottom - edge;
    const maxW  = stage.clientWidth * w / 100;
    let px;
    if (side) {   // 橫式：總寬 ≈ 1.95×總高
      px = Math.min(avail, maxW / 1.95);
      news.style.height = Math.round(px) + 'px';
      news.style.width  = Math.round(px * 1.95) + 'px';
    } else {      // 直式：總高 ≈ 1.52×總寬（插圖 1:1 ＋ 字幕 ＋ 提示列）
      px = Math.min(maxW, avail / 1.52);
      news.style.height = 'auto';
      news.style.width  = Math.round(px) + 'px';
    }
    news.style.right = edge + 'px';
    news.style.top = btnBottom + 'px';
    document.getElementById('copy').style.fontSize   = Math.max(12, Math.round(px * 0.066)) + 'px';
    document.getElementById('prompt').style.fontSize = Math.max(11, Math.round(px * 0.058)) + 'px';
    readout();
  }

  function readout() {
    const hit = (a,b) => !(a.right<b.left||a.left>b.right||a.bottom<b.top||a.top>b.bottom);
    const r = news.getBoundingClientRect(), st = stage.getBoundingClientRect();
    const q = s => document.querySelector(s).getBoundingClientRect();
    const bad = [];
    if (hit(r,q('.g-btns'))) bad.push('圓鈕');
    if (hit(r,q('.g-hud')))  bad.push('HUD');
    if (hit(r,q('.g-ctrl'))) bad.push('擲骰鈕');
    if (r.bottom > st.bottom + 1) bad.push('超出畫面');
    document.getElementById('readout').innerHTML =
      `卡片 <b style="color:var(--amber)">${Math.round(r.width)}×${Math.round(r.height)}</b>　`
      + `佔寬 ${Math.round(r.width/st.width*100)}%・佔高 ${Math.round(r.height/st.height*100)}%<br>`
      + (bad.length ? `<span style="color:#ffcf6b">蓋到：${bad.join('、')}</span>`
                    : `<span style="color:#4ade80">✓ 沒蓋到 HUD／圓鈕／擲骰鈕</span>`)
      + `<br><span style="color:var(--lo)">（小地圖不計）</span>`;
  }

  function show() { news.classList.remove('out'); news.classList.remove('in'); void news.offsetWidth; news.classList.add('in'); }
  function hide() { news.classList.remove('in'); void news.offsetWidth; news.classList.add('out'); }

  function pick(sel, cb) {
    document.querySelectorAll(sel).forEach(b => b.onclick = () => {
      document.querySelectorAll(sel).forEach(x => x.classList.remove('on'));
      b.classList.add('on'); cb(b); render(); show();
    });
  }
  pick('#panel button[data-t]', b => { ti = +b.dataset.t; });
  pick('#panel button[data-c]', b => { copyMode = b.dataset.c; });
  pick('#panel button[data-v]', b => { view = b.dataset.v; });
  pick('#panel button[data-s]', b => {
    const [w,h] = b.dataset.s.split('x');
    stage.style.width = w + 'px'; stage.style.height = h + 'px';
  });
  wR.oninput = apply;
  document.getElementById('replay').onclick = show;
  document.getElementById('press').onclick = hide;
  document.getElementById('prompt').onclick = () => { if (view === 'me') hide(); };
  addEventListener('keydown', e => { if (e.key === ' ' || e.key.toLowerCase() === 'a') { e.preventDefault(); hide(); } });

  render(); show();
</script>
</body>
</html>
