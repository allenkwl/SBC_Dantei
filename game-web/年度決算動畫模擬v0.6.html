<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小球貓電鐵｜年度決算動畫模擬 v0.6</title>
<style>
  :root{
    --ink:#183b42;--navy:#163b46;--teal:#245f65;--teal-deep:#123f48;
    --gold:#f6c85f;--paper:#fff8df;--paper-line:#f3dfaa;--mint:#72d5b4;
  }
  *{box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden}
  body{margin:0;background:#b9d8cf;color:var(--ink);font-family:"PingFang TC","Microsoft JhengHei",sans-serif}
  button{font-family:inherit}
  #annual-settlement{position:fixed;inset:0;background:#b9d8cf;color:var(--ink)}
  .as-stage{
    position:relative;width:100%;height:100%;overflow:hidden;
    background:
      linear-gradient(90deg,rgba(245,237,207,.12),rgba(255,255,255,.03) 50%,rgba(22,58,67,.08)),
      url('assets/screens/annual_settlement_bg_v0.1.png') center/cover no-repeat;
    isolation:isolate;
  }
  .as-stage::before{
    content:"";position:absolute;z-index:0;inset:0;pointer-events:none;
    background:
      linear-gradient(180deg,rgba(16,53,62,.06) 0 13%,transparent 36%,rgba(21,57,62,.13) 100%),
      radial-gradient(circle at 48% 30%,rgba(255,244,190,.25),transparent 38%);
  }
  .as-stage::after{
    content:"";position:absolute;z-index:1;inset:0;pointer-events:none;opacity:.26;
    background:radial-gradient(ellipse at center,transparent 50%,rgba(25,55,52,.42) 135%);
  }
  .as-topbar{
    position:absolute;z-index:20;inset:0 0 auto;height:13%;padding:2.1% 4%;
    display:flex;align-items:center;justify-content:space-between;color:#fffdf0;
    background:linear-gradient(90deg,rgba(18,63,72,.96),rgba(27,76,80,.9));
    border-bottom:2px solid rgba(255,240,184,.52);box-shadow:0 5px 20px rgba(20,52,55,.25);
    backdrop-filter:blur(7px);
  }
  .as-brand{font-size:clamp(13px,2vw,24px);font-weight:900;letter-spacing:.09em;text-shadow:0 2px 3px #102f35}
  .as-season{padding:.45em 1em;border:1px solid #fff2bc88;border-radius:99px;background:#fff4d51f;font-size:clamp(10px,1.35vw,16px);font-weight:800}
  .as-month{
    position:absolute;z-index:4;left:5%;top:22%;width:31%;height:48%;padding:4% 2%;text-align:center;
    border:4px solid rgba(255,252,232,.96);border-radius:24px;
    background:linear-gradient(145deg,rgba(255,252,232,.96),rgba(249,239,204,.93));
    box-shadow:0 13px 30px rgba(52,65,49,.23),inset 0 0 0 2px rgba(205,166,82,.18);
    backdrop-filter:blur(5px);
  }
  .as-month::after{content:"";position:absolute;inset:10px;border:1px solid rgba(176,137,61,.2);border-radius:16px;pointer-events:none}
  .as-month span{display:block;color:#557e78;font-weight:900;font-size:clamp(13px,1.7vw,21px);letter-spacing:.2em}
  .as-month b{display:block;margin-top:5%;color:#246b78;font-size:clamp(45px,7vw,85px);line-height:1;text-shadow:0 2px 0 #fff}
  .as-month small{display:block;margin-top:7%;font-weight:800;font-size:clamp(11px,1.45vw,17px);color:#28484c}
  .as-cat{position:absolute;z-index:6;left:7%;bottom:-4%;width:34%;height:auto;filter:drop-shadow(0 10px 9px #173f4455);animation:asBob 1.4s ease-in-out infinite alternate}
  @keyframes asBob{to{transform:translateY(-10px) rotate(-1deg)}}
  .as-speech{
    position:absolute;z-index:7;left:31%;top:26%;width:30%;min-height:20%;padding:2.2%;
    border:4px solid #fffdf0;border-radius:22px;background:rgba(255,250,226,.98);color:#24484c;
    font-size:clamp(13px,1.7vw,22px);font-weight:900;line-height:1.45;
    box-shadow:0 8px 0 rgba(77,120,113,.45),0 13px 25px rgba(36,71,70,.15);
    transition:opacity .35s,transform .35s;
  }
  .as-speech::before{content:"";position:absolute;left:-20px;bottom:20px;border:12px solid transparent;border-right-color:#fffdf0}
  .as-speech.hide{opacity:0;transform:translateY(-12px);pointer-events:none}
  .as-board{
    position:absolute;z-index:5;right:4%;top:19%;width:46%;padding:2% 2.4%;
    border:5px solid #f7e7ad;border-radius:20px;
    background:linear-gradient(145deg,rgba(25,81,87,.96),rgba(17,61,73,.96));color:#fff;
    box-shadow:0 10px 0 rgba(16,57,61,.58),0 18px 34px rgba(27,48,45,.22);
    opacity:0;transform:translateY(18px);transition:.55s ease;
  }
  .as-board.show{opacity:1;transform:none}
  .as-board h2{margin:0 0 3%;text-align:center;font-size:clamp(17px,2.35vw,30px);letter-spacing:.08em;color:#fff8db;text-shadow:0 2px 2px #103f45}
  .as-rows{display:grid;gap:8px}
  .as-row{display:grid;grid-template-columns:11% 1fr 28% 27%;align-items:center;padding:1.5% 2%;border-radius:10px;background:#fff2;font-size:clamp(10px,1.35vw,17px);font-weight:800;opacity:0;transform:translateX(30px);transition:.4s ease}
  .as-row.show{opacity:1;transform:none}.as-row.leader{outline:2px solid var(--gold);background:#f6c85f35}
  .as-rank,.up{color:#ffe58e}.as-total{text-align:right}.as-row>:last-child{text-align:right}.down{color:#ffbdc8}
  #as-leader{
    position:absolute;z-index:8;top:70%;left:73%;width:46%;transform:translateX(-50%) scale(.75);padding:.45em .8em;
    border:3px solid var(--gold);border-radius:18px;background:rgba(21,78,83,.95);color:#fffdf0;text-align:center;
    text-shadow:0 3px 0 #16464a,0 5px 12px #16384e77;font-size:clamp(20px,2.8vw,37px);font-weight:900;opacity:0;transition:.45s;
  }
  #as-leader.show{opacity:1;transform:translateX(-50%) scale(1)}
  #as-leader-info{position:absolute;z-index:8;top:80%;left:73%;width:46%;transform:translateX(-50%);text-align:center;color:#fff;font-size:clamp(12px,1.7vw,21px);font-weight:800;-webkit-text-stroke:1.5px #153f46;paint-order:stroke fill;text-shadow:0 2px 4px #102f35;opacity:0;transition:.4s}
  #as-leader-info.show{opacity:1}
  #as-prompt,.as-chart-prompt{
    position:absolute;z-index:24;left:50%;transform:translateX(-50%);padding:.7em 1.25em;
    border:2px solid #fff1b5;border-radius:99px;background:rgba(18,63,72,.96);color:#fff;
    font-size:clamp(12px,1.55vw,18px);font-weight:900;white-space:nowrap;cursor:pointer;
    box-shadow:0 5px 15px rgba(18,54,58,.25);opacity:0;pointer-events:none;transition:.3s;animation:asPulse 1.1s infinite;
  }
  #as-prompt{bottom:7%}#as-prompt.show{opacity:1;pointer-events:auto}
  #as-prompt:focus-visible,.as-chart-prompt:focus-visible,#play:focus-visible{outline:4px solid #fff4a8;outline-offset:3px}
  @keyframes asPulse{50%{transform:translateX(-50%) scale(1.06)}}
  #as-chart{
    position:absolute;z-index:30;inset:0;padding:12vh 8vw 8vh;
    background:linear-gradient(135deg,rgba(17,55,65,.96),rgba(33,94,98,.91));
    color:#fff;opacity:0;pointer-events:none;transition:.45s;backdrop-filter:blur(3px);
  }
  #as-chart.show{opacity:1;pointer-events:auto}
  #as-chart h2{margin:0;text-align:center;font-size:clamp(26px,4vw,52px);letter-spacing:.08em;color:#fff9df;text-shadow:0 3px 0 #174149}
  #as-chart p{margin:.55em 0 1.2em;text-align:center;font-size:clamp(13px,1.7vw,20px);font-weight:800;color:#dff4ec}
  .as-chart-wrap{height:58vh;padding:2%;border:3px solid #fff0b89e;border-radius:22px;background:rgba(8,42,49,.48);box-shadow:inset 0 0 36px rgba(2,25,30,.18)}
  .as-chart-wrap svg{width:100%;height:100%;overflow:visible}.as-grid{stroke:#fff5;stroke-width:1}.as-axis{fill:#ecf9f5;font-size:14px;font-weight:800}.as-line-label{font-size:16px;font-weight:900;stroke:#173f46;stroke-width:4px;stroke-linejoin:round;paint-order:stroke fill}
  .as-chart-prompt{bottom:4%;opacity:1;pointer-events:auto}
  #play{position:absolute;z-index:40;right:3%;bottom:4%;border:1px solid #fff1b5;border-radius:99px;padding:.7em 1.2em;background:#f4c65d;color:#4d3b10;font-size:clamp(11px,1.4vw,16px);font-weight:900;cursor:pointer;box-shadow:0 4px 0 #b98524}
  #play:active{transform:translateY(3px);box-shadow:0 1px 0 #b98524}
  .hint{position:absolute;z-index:18;bottom:4%;left:4%;color:#214e50;font-size:clamp(9px,1.1vw,13px);font-weight:900;text-shadow:0 1px 2px #fff8}
  @media(max-width:560px){.as-speech{left:28%;width:38%;top:24%}.as-month{left:2%;width:29%}.as-cat{left:1%;width:37%}.as-board{right:2%;width:48%}.as-row{grid-template-columns:13% 1fr 25% 30%;gap:2px}.hint{display:none}}
</style>
</head>
<body>
<main id="annual-settlement" aria-label="年度決算新聞動畫模擬">
  <div class="as-stage">
    <header class="as-topbar"><span class="as-brand">🐾 小球貓電鐵・年度財經快報</span><span class="as-season">三月結算 → 四月開始</span></header>
    <section class="as-month"><span>年度結算</span><b id="as-year">第 4 年</b><small>三月已結束，盤點資產中⋯</small></section>
    <img class="as-cat" src="../圖片/角色大頭貼/去背/站長-去背.png" alt="站長貓咪主播">
    <div class="as-speech" id="as-speech"></div>
    <section class="as-board" id="as-board" aria-live="polite"><h2>年度資產排行榜</h2><div class="as-rows" id="as-rows"></div></section>
    <div id="as-leader">🏆 本年度領先者</div><div id="as-leader-info"></div>
    <button id="as-prompt" type="button">按 A／空白鍵或點這裡，查看歷年資產比較</button>
    <section id="as-chart"><h2>📈 歷年資產變化</h2><p>所有玩家的每年總資產比較</p><div class="as-chart-wrap"><svg id="as-chart-svg" viewBox="0 0 900 430" role="img" aria-label="所有玩家歷年資產變化折線圖"></svg></div><button class="as-chart-prompt" id="as-chart-go" type="button">按 A／空白鍵或點這裡，繼續四月旅程</button></section>
    <span class="hint">獨立年度決算動畫模擬 v0.6</span><button id="play" type="button">↻ 再播一次</button>
  </div>
</main>
<script>
  const colors={探險家:'#ff7696',旅行家:'#ffd66b',賓士:'#82d8b1',站長:'#bda0ff'};
  const players=[
    {name:'探險家',start:1260,total:1890},{name:'旅行家',start:1510,total:1460},
    {name:'賓士',start:980,total:1740},{name:'站長',start:1330,total:1570}
  ];
  const history=[
    {year:1,values:[['探險家',720],['旅行家',860],['賓士',650],['站長',910]].map(([name,total])=>({name,total,color:colors[name]}))},
    {year:2,values:[['探險家',980],['旅行家',1170],['賓士',790],['站長',1110]].map(([name,total])=>({name,total,color:colors[name]}))},
    {year:3,values:[['探險家',1260],['旅行家',1510],['賓士',980],['站長',1330]].map(([name,total])=>({name,total,color:colors[name]}))},
    {year:4,values:[['探險家',1890],['旅行家',1460],['賓士',1740],['站長',1570]].map(([name,total])=>({name,total,color:colors[name]}))}
  ];
  const board=document.getElementById('as-board'),rows=document.getElementById('as-rows'),speech=document.getElementById('as-speech');
  const leader=document.getElementById('as-leader'),leaderInfo=document.getElementById('as-leader-info'),prompt=document.getElementById('as-prompt');
  const chart=document.getElementById('as-chart'),chartGo=document.getElementById('as-chart-go');
  let phase='playing',timers=[];
  function formatMoney(wan){
    const neg=wan<0;let abs=Math.round(Math.abs(wan));const zhao=Math.floor(abs/1e8);abs-=zhao*1e8;const yi=Math.floor(abs/1e4);abs-=yi*1e4;const parts=[];
    if(zhao>0)parts.push(`${zhao}兆`);if(yi>0)parts.push(`${yi}億`);if(abs>0||!parts.length)parts.push(`${abs}萬`);return(neg?'-':'')+parts.join('');
  }
  function drawAnnualChart(data){
    const svg=document.getElementById('as-chart-svg'),w=900,h=430,left=75,right=100,top=28,bottom=58;
    const all=data.flatMap(entry=>entry.values.map(v=>v.total)),max=Math.max(100,...all),ceiling=Math.ceil(max/100)*100;
    const x=i=>data.length===1?left+(w-left-right)/2:left+i*(w-left-right)/(data.length-1);
    const y=n=>top+(ceiling-n)*(h-top-bottom)/ceiling;let out='';
    for(let i=0;i<=4;i++){const n=Math.round(ceiling*i/4);out+=`<line class="as-grid" x1="${left}" y1="${y(n)}" x2="${w-right}" y2="${y(n)}"/><text class="as-axis" x="${left-12}" y="${y(n)+5}" text-anchor="end">${n}</text>`}
    data.forEach((entry,i)=>out+=`<text class="as-axis" x="${x(i)}" y="${h-20}" text-anchor="middle">第 ${entry.year} 年</text>`);
    const names=data[data.length-1].values;
    names.forEach(p=>{const pts=data.map((entry,i)=>{const value=(entry.values.find(v=>v.name===p.name)||{}).total||0;return`${x(i)},${y(value)}`}).join(' ');out+=`<polyline points="${pts}" fill="none" stroke="${p.color}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>`;data.forEach((entry,i)=>{const value=(entry.values.find(v=>v.name===p.name)||{}).total||0;out+=`<circle cx="${x(i)}" cy="${y(value)}" r="7" fill="${p.color}" stroke="#fff" stroke-width="3"/>`});const last=(data[data.length-1].values.find(v=>v.name===p.name)||{}).total||0;out+=`<text class="as-line-label" x="${Math.min(w-right+12,x(data.length-1)+14)}" y="${y(last)+5}" fill="${p.color}">${p.name}</text>`});
    svg.innerHTML=out;
  }
  function run(){
    timers.forEach(clearTimeout);timers=[];phase='playing';chart.classList.remove('show');prompt.classList.remove('show');
    speech.classList.remove('hide');speech.innerHTML='三月結束囉！<br>現在開始盤點每位玩家的年度資產⋯';
    leader.classList.remove('show');leaderInfo.classList.remove('show');board.classList.remove('show');rows.innerHTML='';
    const ranking=players.slice().sort((a,b)=>b.total-a.total);
    ranking.forEach((p,i)=>{const change=p.total-p.start,row=document.createElement('div');row.className=`as-row ${i===0?'leader':''}`;row.innerHTML=`<span class="as-rank">${i===0?'👑':'#'+(i+1)}</span><span class="as-name">${p.name}</span><span class="as-total">${formatMoney(p.total)}元</span><span class="${change>=0?'up':'down'}">${change>=0?'▲':'▼'} ${formatMoney(Math.abs(change))}</span>`;rows.appendChild(row);timers.push(setTimeout(()=>row.classList.add('show'),450+i*780))});
    requestAnimationFrame(()=>requestAnimationFrame(()=>board.classList.add('show')));
    timers.push(setTimeout(()=>speech.classList.add('hide'),1450));
    timers.push(setTimeout(()=>{const winner=ranking[0];leaderInfo.textContent=`${winner.name}以 ${formatMoney(winner.total)}元 暫居第一名`;leader.classList.add('show');leaderInfo.classList.add('show');prompt.classList.add('show');phase='result'},4100+Math.max(0,ranking.length-1)*780));
  }
  function advance(){
    if(phase==='result'){drawAnnualChart(history);chart.classList.add('show');prompt.classList.remove('show');phase='chart';return}
    if(phase==='chart'){chart.classList.remove('show');phase='done';speech.innerHTML='年度決算已完成！<br>四月的旅程，現在開始！'}
  }
  addEventListener('keydown',event=>{if(event.code!=='Space'&&event.key!=='a'&&event.key!=='A')return;event.preventDefault();advance()});
  prompt.addEventListener('click',advance);chartGo.addEventListener('click',advance);document.getElementById('play').addEventListener('click',run);
  run();
</script>
</body>
</html>
