<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>小球貓電鐵｜捷徑卡片直升機動畫模擬 v0.3</title>
<style>
*{box-sizing:border-box}html,body,#stage{margin:0;width:100%;height:100%;overflow:hidden;font-family:"PingFang TC","Microsoft JhengHei",sans-serif;background:#14364f}#world{position:absolute;transform-origin:0 0;width:2180px;height:2495px;background:url('assets/map_bg.svg') 0 0/2180px 2495px no-repeat}.station{position:absolute;z-index:4;width:0;height:0}.station i{position:absolute;transform:translate(-50%,-50%);width:42px;height:42px;border:4px solid #fff;border-radius:50%;background:#287ab0;box-shadow:0 4px 10px #12364a99}.station b{position:absolute;top:27px;left:0;transform:translateX(-50%);padding:4px 9px;border-radius:9px;background:#123b5ae8;color:#fff;font-size:15px;white-space:nowrap;text-shadow:0 1px #000}.station.target i{background:#f4a61b;animation:pulse .75s ease-in-out infinite alternate}@keyframes pulse{to{transform:translate(-50%,-50%) scale(1.18);box-shadow:0 0 0 16px #ffd55a66,0 0 24px #fff4a9}}#route{position:absolute;inset:0;width:2180px;height:2495px;overflow:visible;pointer-events:none;z-index:2}#route path{fill:none;stroke:#fff0a0;stroke-width:10;stroke-linecap:round;stroke-dasharray:20 22;filter:drop-shadow(0 3px 2px #12364a99);opacity:0}#route.play path{animation:dash var(--dur) linear forwards}@keyframes dash{0%{opacity:0;stroke-dashoffset:220}10%{opacity:1}100%{opacity:1;stroke-dashoffset:0}}#heli{position:absolute;z-index:5;width:130px;transform:translate(-50%,-55%);filter:drop-shadow(0 11px 5px #102d4288)}#heli.fly{animation:bob .24s ease-in-out infinite alternate}@keyframes bob{to{margin-top:-10px;transform:translate(-50%,-55%) rotate(-5deg)}}#card{position:absolute;z-index:20;left:4%;top:5%;width:min(300px,43vw);padding:17px 19px;border:4px solid #fff4b0;border-radius:21px;background:linear-gradient(145deg,#266b99,#123751);box-shadow:0 9px 0 #0b2b4388;color:#fff;transform:translateY(-135%);opacity:0;transition:.42s}#card.show{transform:none;opacity:1}#card small{color:#ffe481;font-weight:900;letter-spacing:.15em}#card h1{margin:5px 0 2px;font-size:clamp(25px,3vw,39px)}#card p{margin:0;font-weight:800}.banner{position:absolute;z-index:20;left:50%;top:8%;transform:translateX(-50%) scale(.7);padding:11px 22px;border:3px solid #fff;border-radius:999px;background:#fffdf3;color:#183b55;box-shadow:0 5px #9acfe0;font-weight:900;white-space:nowrap;opacity:0;transition:.35s}.banner.show{transform:translateX(-50%) scale(1);opacity:1}#arrival{top:19%;font-size:clamp(21px,3vw,37px)}#ctl{position:fixed;z-index:30;right:16px;bottom:16px;width:270px;padding:14px;border:2px solid #65afd2;border-radius:16px;background:#102e49ee;color:#e8f8ff;box-shadow:0 10px 26px #081c2e99}#ctl h3{margin:0 0 6px;color:#ffdb64;font-size:15px}#ctl p{margin:0 0 10px;color:#a8cbdc;font-size:12px;line-height:1.45}select,button{width:100%;font:800 14px inherit}select{padding:8px;margin-bottom:8px;border:2px solid #65afd2;border-radius:8px;background:#173e5a;color:#fff}button{padding:10px;border:3px solid #fff4ae;border-radius:10px;background:linear-gradient(#ffdb64,#f2a11e);box-shadow:0 4px #ad6b0a;color:#3c2900;cursor:pointer}button:active{transform:translateY(3px);box-shadow:0 1px #ad6b0a}@media(max-width:700px){#ctl{right:8px;bottom:8px;width:215px}#heli{width:96px}}
</style></head><body>
<main id="stage"><div id="world"><svg id="route"><path id="routePath"/></svg><div id="from" class="station"><i></i><b></b></div><div id="to" class="station target"><i></i><b>花蓮</b></div><img id="heli" src="../圖片/玩家icon/直升機.png" alt="捷徑直升機"></div><section id="card"><small>移動卡片</small><h1>🚁 蘇花捷徑</h1><p>直接前往花蓮</p></section><div id="use" class="banner">探險家使用「蘇花捷徑」！</div><div id="arrival" class="banner">🎉 抵達花蓮！</div><aside id="ctl"><h3>捷徑卡片動畫 v0.3</h3><p>讀取遊戲地圖的實際站點座標。地圖倍率固定為玩家移動時的近景倍率 9.6×。</p><select id="origin"><option value="tr_taipei">台北</option><option value="tr_taichung" selected>台中</option><option value="tr_tainan">台南</option><option value="tr_kaohsiung">高雄</option></select><button id="play">🚁 使用蘇花捷徑</button></aside></main>
<script src="map_data.js"></script><script>
const $=id=>document.getElementById(id),world=$('world'),from=$('from'),to=$('to'),heli=$('heli'),route=$('route'),path=$('routePath');const W=MAP_DATA.meta.world, stations=new Map(MAP_DATA.stations.map(s=>[s.id,s]));let startTime=0,run=false,cam={x:0,y:0},frame=0;const target=stations.get('tr_hualien');
function place(el,s){el.style.left=(s.x-W.x)+'px';el.style.top=(s.y-W.y)+'px'}function transform(){const scale=9.6;world.style.transform=`translate(${innerWidth/2-(cam.x-W.x)*scale}px,${innerHeight/2-(cam.y-W.y)*scale}px) scale(${scale})`}
function reset(){cancelAnimationFrame(frame);run=false;const s=stations.get($('origin').value);place(from,s);place(to,target);from.querySelector('b').textContent=s.name;place(heli,s);const a={x:s.x-W.x,y:s.y-W.y},b={x:target.x-W.x,y:target.y-W.y};path.setAttribute('d',`M ${a.x} ${a.y} L ${b.x} ${b.y}`);route.classList.remove('play');heli.classList.remove('fly');['card','use','arrival'].forEach(id=>$(id).classList.remove('show'));cam.x=s.x;cam.y=s.y;transform()}
function play(){reset();const s=stations.get($('origin').value),dx=target.x-s.x,dy=target.y-s.y,dist=Math.hypot(dx,dy),dur=Math.max(1100,dist/210*1000);route.style.setProperty('--dur',dur+'ms');$('card').classList.add('show');setTimeout(()=>$('use').classList.add('show'),280);setTimeout(()=>{run=true;startTime=performance.now();route.classList.add('play');heli.classList.add('fly');tick(dur,s)},760)}
function tick(dur,s){const now=performance.now(),t=Math.min(1,(now-startTime)/dur),x=s.x+(target.x-s.x)*t,y=s.y+(target.y-s.y)*t;place(heli,{x,y});cam.x+=(x-cam.x)*.14;cam.y+=(y-cam.y)*.14;transform();if(t<1){frame=requestAnimationFrame(()=>tick(dur,s));return}run=false;heli.classList.remove('fly');cam.x=target.x;cam.y=target.y;transform();$('arrival').classList.add('show')}
$('play').onclick=play;$('origin').onchange=reset;addEventListener('resize',()=>{if(!run)reset()});reset();
</script></main></body></html>
