<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>小球貓電鐵｜宣傳短片 v0.2</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #0b1d31; font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; }
    body { display: grid; place-items: center; padding: 22px; }
    #trailer { position: relative; isolation: isolate; width: min(100%, 1280px); aspect-ratio: 16 / 9; overflow: hidden; border: 4px solid #f5c84c; border-radius: 22px; background: #123a5a; box-shadow: 0 24px 70px #000b; }
    .scene { position: absolute; inset: 0; opacity: 0; pointer-events: none; transition: opacity .75s ease; background: #123a5a; }
    .scene.active { opacity: 1; pointer-events: auto; }
    .scene iframe { display: block; width: 100%; height: 100%; border: 0; background: #123a5a; }
    .title-scene, .closing-scene { display: grid; place-items: center; text-align: center; background: linear-gradient(#0f2f4da8, #09182bd9), url("assets/screens/title.jpg") center / cover; }
    .title-copy, .closing-copy { padding: 4vw; color: white; text-shadow: 0 5px 0 #102a43, 0 8px 20px #000c; }
    h1 { margin: 0; color: #ffd85e; font-size: clamp(34px, 6vw, 84px); letter-spacing: .07em; -webkit-text-stroke: 1px #613b03; }
    h2 { margin: .35em 0 0; font-size: clamp(19px, 2.6vw, 36px); letter-spacing: .08em; }
    .tag { display: inline-block; margin-bottom: 16px; padding: .45em 1em; border: 2px solid #fff3b4; border-radius: 999px; background: #173f60e8; color: #fff3b4; font-size: clamp(13px, 1.4vw, 19px); font-weight: 800; letter-spacing: .12em; }
    .caption { position: absolute; z-index: 3; left: 5%; bottom: 9%; max-width: 74%; color: #fff; font-weight: 900; font-size: clamp(22px, 4vw, 52px); line-height: 1.2; text-shadow: 0 4px 0 #16354f, 0 7px 18px #000c; opacity: 0; transform: translateY(16px); transition: .4s ease .25s; pointer-events: none; }
    .scene.active .caption { opacity: 1; transform: none; }
    .caption small { display: block; margin-top: .45em; color: #ffdc65; font-size: .44em; letter-spacing: .08em; }
    .vignette { position: absolute; inset: 0; z-index: 2; pointer-events: none; box-shadow: inset 0 -120px 100px -80px #000c, inset 0 0 80px #00112666; }
    .top-label { position: absolute; z-index: 3; top: 4%; left: 50%; transform: translateX(-50%); padding: .45em .9em; border: 2px solid #fff6c5; border-radius: 99px; background: #163d5ce8; color: #fff; font-size: clamp(12px, 1.5vw, 18px); font-weight: 900; letter-spacing: .12em; white-space: nowrap; pointer-events: none; }
    #controls { position: absolute; z-index: 6; right: 18px; bottom: 16px; display: flex; gap: 8px; }
    #controls button { min-width: 42px; padding: 9px 13px; border: 2px solid #ffe69a; border-radius: 12px; background: #123650e8; color: white; font: 800 15px inherit; cursor: pointer; box-shadow: 0 3px 0 #071b2c; }
    #controls button:hover { background: #235b80; }
    #progress { position: absolute; z-index: 7; right: 0; bottom: 0; left: 0; height: 7px; background: #06182799; }
    #progress > i { display: block; width: 0; height: 100%; background: linear-gradient(90deg, #ffca44, #ffef8a); transition: width .1s linear; }
    .scene[data-name="dice"] iframe { transform: scale(1.02); }
    .start-gate { position: absolute; z-index: 20; inset: 0; display: grid; place-items: center; background: linear-gradient(#0b2134aa, #09182be8), url("assets/screens/title.jpg") center / cover; }
    .start-gate[hidden] { display: none; }
    .start-gate button { padding: .7em 1.4em; border: 3px solid #fff3b4; border-radius: 999px; background: linear-gradient(#ffdf68, #ec9b1e); box-shadow: 0 7px 0 #8b4e08, 0 16px 28px #0009; color: #1b3041; font: 900 clamp(21px, 3vw, 38px) inherit; cursor: pointer; }
    .start-gate button:active { transform: translateY(5px); box-shadow: 0 2px 0 #8b4e08, 0 8px 16px #0009; }
    .start-gate p { margin: 1.1em 0 0; color: white; font-size: clamp(13px, 1.6vw, 20px); font-weight: 800; text-align: center; text-shadow: 0 2px 5px #000; }
    /* 宣傳版裁切模擬器的調校面板，保留實際動畫舞台。 */
    .scene[data-name="shortcut"] iframe, .scene[data-name="arrival"] iframe { width: 150%; margin-left: -25%; }
    .scene[data-name="settlement"] .caption { bottom: 7%; }
    @media (max-width: 720px) { body { padding: 0; } #trailer { width: 100vw; border-width: 0; border-radius: 0; } #controls { right: 9px; bottom: 11px; } #controls button { padding: 6px 9px; } }
  </style>
</head>
<body>
  <main id="trailer" aria-label="小球貓電鐵宣傳短片">
    <section class="scene title-scene active" data-name="title" data-duration="5200">
      <div class="title-copy"><span class="tag">台灣鐵道 × 歡樂大富翁</span><h1>小球貓電鐵</h1><h2>和貓咪一起，展開全台冒險！</h2></div>
    </section>
    <section class="scene" data-name="game" data-duration="6500">
      <iframe title="小球貓電鐵遊戲畫面" src="小球貓電鐵v1.28.html" tabindex="-1"></iframe><div class="vignette"></div><div class="caption">搭上列車，走遍台灣每一站<small>在豐富的地圖上規劃你的旅程</small></div>
    </section>
    <section class="scene" data-name="dice" data-duration="5500">
      <iframe title="正式遊戲擲骰畫面" src="小球貓電鐵v1.28.html" tabindex="-1"></iframe><div class="vignette"></div><div class="caption">輪到你，擲骰出發！<small>正式遊戲畫面中的擲骰與旅程選擇</small></div>
    </section>
    <section class="scene" data-name="shortcut" data-duration="6500">
      <iframe title="捷徑卡片直升機動畫" src="捷徑卡片直升機動畫模擬v0.9.html" tabindex="-1"></iframe><div class="vignette"></div><div class="top-label">🚁 蘇花捷徑卡片</div><div class="caption">善用卡片，突破距離限制<small>直升機帶你飛越山海，直達目的地</small></div>
    </section>
    <section class="scene" data-name="arrival" data-duration="6200">
      <iframe title="目的地慶祝動畫" src="目的地慶祝動畫模擬v0.9.html" tabindex="-1"></iframe><div class="vignette"></div><div class="caption">抵達目的地，全站一起歡呼！<small>每一次進站，都是值得慶祝的冒險</small></div>
    </section>
    <section class="scene" data-name="settlement" data-duration="6000">
      <iframe title="年度決算動畫" src="年度決算動畫模擬v0.4.html" tabindex="-1"></iframe><div class="vignette"></div><div class="caption">三月年度決算，誰是鐵道王者？<small>資產排行與歷年成長一目了然</small></div>
    </section>
    <section class="scene closing-scene" data-name="closing" data-duration="5200">
      <div class="closing-copy"><span class="tag">鐵道、卡片、目的地與驚喜</span><h1>下一站，等你出發！</h1><h2>小球貓電鐵</h2></div>
    </section>
    <div class="start-gate" id="start-gate"><div><button id="start" type="button">▶ 點擊開始播放</button><p>點擊後將以全螢幕播放宣傳短片</p></div></div>
    <div id="controls" aria-label="短片控制"><button id="restart" type="button" title="重新播放">↻</button><button id="toggle" type="button" title="暫停">Ⅱ</button></div>
    <div id="progress" aria-hidden="true"><i></i></div>
  </main>
  <script>
    (() => {
      const scenes = [...document.querySelectorAll('.scene')];
      const fill = document.querySelector('#progress i');
      const toggle = document.querySelector('#toggle');
      const startGate = document.querySelector('#start-gate');
      const start = document.querySelector('#start');
      let index = 0, elapsed = 0, last = performance.now(), playing = false, frame;
      const total = scenes.reduce((sum, scene) => sum + Number(scene.dataset.duration), 0);
      function restartEmbeddedScene(scene) {
        const frame = scene.querySelector('iframe');
        if (!frame) return;
        const autoplayShortcut = () => {
          if (scene.dataset.name !== 'shortcut') return;
          const play = frame.contentDocument && frame.contentDocument.querySelector('#play');
          if (play) play.click();
        };
        frame.addEventListener('load', autoplayShortcut, { once: true });
        frame.src = frame.getAttribute('src');
      }
      function activate(next) {
        scenes[index].classList.remove('active');
        index = (next + scenes.length) % scenes.length;
        scenes[index].classList.add('active');
        restartEmbeddedScene(scenes[index]);
      }
      function tick(now) {
        if (playing) {
          elapsed += now - last;
          const duration = Number(scenes[index].dataset.duration);
          if (elapsed >= duration) { elapsed = 0; activate(index + 1); }
          const completed = scenes.slice(0, index).reduce((sum, scene) => sum + Number(scene.dataset.duration), 0) + elapsed;
          fill.style.width = `${Math.min(100, completed / total * 100)}%`;
        }
        last = now;
        frame = requestAnimationFrame(tick);
      }
      function restart() { activate(0); elapsed = 0; last = performance.now(); playing = true; toggle.textContent = 'Ⅱ'; toggle.title = '暫停'; }
      async function startTrailer() {
        try { if (!document.fullscreenElement) await document.querySelector('#trailer').requestFullscreen(); } catch (_) {}
        startGate.hidden = true;
        playing = true;
        last = performance.now();
      }
      start.addEventListener('click', startTrailer);
      document.querySelector('#restart').addEventListener('click', restart);
      toggle.addEventListener('click', () => { playing = !playing; toggle.textContent = playing ? 'Ⅱ' : '▶'; toggle.title = playing ? '暫停' : '播放'; last = performance.now(); });
      document.addEventListener('keydown', event => { if (startGate.hidden && event.code === 'Space') { event.preventDefault(); toggle.click(); } if (startGate.hidden && event.key === 'ArrowRight') { elapsed = 0; activate(index + 1); } });
      frame = requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
