<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小球貓電鐵 v0.65 — Phase 2A</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --navy: #0C1A28; --panel: #172B40cc; --rim: #254663;
    --amber: #F0A020; --text: #D4E6F4; --lo: #5E84A4;
    --ui: system-ui, -apple-system, 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  }
  html, body { width:100%; height:100%; overflow:hidden; background:var(--navy); font-family:var(--ui); color:var(--text); }
  #game { position:fixed; inset:0; width:100%; height:100%; display:block; cursor:grab; }

  /* HUD 左上：月曆 + 玩家 */
  #hud {
    position:fixed; top:14px; left:14px; z-index:10;
    background:var(--panel); border:1px solid var(--rim); border-radius:10px;
    padding:12px 14px; backdrop-filter:blur(6px); min-width:200px;
  }
  #calendar { font-size:15px; font-weight:700; color:var(--amber); letter-spacing:.08em; margin-bottom:8px; }
  /* HUD 只顯示「輪到的那位玩家」，頭像跟字都放大，其他人資訊不顯示 */
  .p-row-cur { display:flex; align-items:center; gap:12px; }
  .p-row-cur .avatar-cur { width:56px; height:56px; border-radius:50%; border:2.5px solid var(--amber); flex-shrink:0; object-fit:cover; }
  .p-row-cur .dot-cur { width:40px; height:40px; border-radius:50%; border:2.5px solid var(--amber); flex-shrink:0; }
  .p-cur-name { font-size:19px; font-weight:700; color:var(--text); display:flex; align-items:center; gap:6px; }
  .p-cur-name .ai-tag {
    font-size:11px; font-weight:700; color:#20150a; background:var(--amber);
    border-radius:5px; padding:2px 6px; letter-spacing:.03em;
  }
  .p-cur-money { color:#FFD54A; font-size:16px; font-weight:700; margin-top:3px; }
  .p-cur-loc { color:var(--lo); font-size:13px; margin-top:2px; }

  /* 控制列：下方中央 */
  #controls {
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%); z-index:10;
    display:flex; align-items:center; gap:12px;
  }
  #btn-roll {
    height:52px; padding:0 30px; font-size:18px; font-weight:700; font-family:var(--ui);
    background:var(--amber); color:#20150a; border:none; border-radius:26px; cursor:pointer;
    box-shadow:0 4px 16px rgba(0,0,0,.45); transition:transform .1s;
  }
  #btn-roll:hover:not(:disabled) { transform:scale(1.05); }
  #btn-roll:disabled { opacity:.35; cursor:default; }
  #btn-zoom {
    height:44px; padding:0 16px; font-size:13px; font-family:var(--ui);
    background:var(--panel); color:var(--text); border:1px solid var(--rim); border-radius:22px; cursor:pointer;
  }

  /* 骰子動畫 */
  #dice {
    position:fixed; top:38%; left:50%; transform:translate(-50%,-50%) scale(.4);
    font-size:110px; z-index:20; opacity:0; pointer-events:none;
    transition:all .35s cubic-bezier(.2,1.6,.4,1); color:#fff;
    text-shadow:0 6px 24px rgba(0,0,0,.6);
  }
  #dice.show { opacity:1; transform:translate(-50%,-50%) scale(1); }

  /* 岔路箭頭 */
  #branch-layer { position:fixed; inset:0; z-index:15; pointer-events:none; }
  .branch-btn {
    position:absolute; width:44px; height:44px; border-radius:50%; pointer-events:auto;
    background:var(--amber); color:#20150a; border:2px solid #fff; cursor:pointer;
    font-size:20px; display:flex; align-items:center; justify-content:center;
    transform:rotate(var(--ang)); box-shadow:0 3px 12px rgba(0,0,0,.5);
    animation:pulse 1s infinite alternate;
  }
  @keyframes pulse { from{box-shadow:0 0 0 0 rgba(240,160,32,.7);} to{box-shadow:0 0 0 12px rgba(240,160,32,0);} }
  .branch-btn.green-btn {
    background:#22C55E !important; color:#08290f; border-color:#fff;
    animation:pulse-green 1s infinite alternate;
  }
  @keyframes pulse-green { from{box-shadow:0 0 0 0 rgba(34,197,94,.7);} to{box-shadow:0 0 0 12px rgba(34,197,94,0);} }

  /* 提示 */
  #toast {
    position:fixed; bottom:92px; left:50%; transform:translateX(-50%) translateY(16px); z-index:20;
    background:var(--panel); border:1px solid var(--rim); color:var(--text);
    padding:10px 22px; border-radius:22px; font-size:14px; opacity:0; transition:all .25s;
    backdrop-filter:blur(6px); white-space:nowrap;
  }
  #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

  /* 小地圖 */
  #minimap {
    position:fixed; right:14px; bottom:14px; z-index:10;
    border:1px solid var(--rim); border-radius:8px; background:rgba(17,38,59,.8);
    backdrop-filter:blur(6px);
  }

  /* 靜音切換：固定在右上角，開場／選人數／遊戲中都看得到。
     設定（齒輪）內容（查資產、延長年數）只有遊戲開始後才有意義，預設隱藏，開局才顯示 */
  #btn-mute, #btn-settings {
    position:fixed; top:14px; z-index:70;
    width:40px; height:40px; border-radius:50%; cursor:pointer;
    background:var(--panel); border:1px solid var(--rim); color:var(--text);
    font-size:17px; align-items:center; justify-content:center;
    backdrop-filter:blur(6px);
  }
  #btn-mute { right:14px; display:flex; }
  #btn-settings { right:62px; display:none; }
  #btn-settings.show { display:flex; }
  #btn-mute:hover, #btn-settings:hover { border-color:var(--amber); }

  /* 開場：純畫面，無選單。按任意鍵／點滑鼠 1 秒後進入人數選擇畫面 */
  #splash {
    position:fixed; inset:0; z-index:55; overflow:hidden; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  #splash-bg {
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
    filter:brightness(.6); z-index:0;
  }
  #splash .splash-title {
    position:absolute; z-index:1; top:36px; right:44px; text-align:right;
    text-shadow:0 4px 20px rgba(0,0,0,.8), 0 0 4px rgba(0,0,0,.9);
  }
  #splash .splash-title h1 {
    font-size:88px; color:var(--amber); letter-spacing:.1em; font-weight:900;
  }
  #splash .splash-title .subtitle {
    color:#fff; font-size:20px; font-weight:600; margin-top:14px; letter-spacing:.06em;
  }
  #splash .splash-hint {
    position:absolute; bottom:30px; left:50%; transform:translateX(-50%); z-index:1;
    font-size:13px; color:rgba(255,255,255,.8); text-shadow:0 1px 4px rgba(0,0,0,.8);
    animation:hintPulse 1.6s infinite alternate;
  }
  @keyframes hintPulse { from{opacity:.5;} to{opacity:1;} }
  #splash-version {
    position:absolute; left:16px; bottom:12px; z-index:1;
    font-size:13px; color:rgba(255,255,255,.85); font-family:Menlo, monospace;
    text-shadow:0 1px 4px rgba(0,0,0,.8);
  }

  /* 人數選擇畫面 */
  #setup {
    position:fixed; inset:0; z-index:50; overflow:hidden; display:none;
    flex-direction:column; align-items:center; justify-content:center; gap:18px;
    background:#0C1A28;
  }
  #setup-bg {
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
    filter:brightness(.62); z-index:0;
  }
  #setup::after {
    content:''; position:absolute; inset:0; z-index:0;
    background:linear-gradient(180deg, rgba(12,26,40,.25) 0%, rgba(12,26,40,.35) 55%, rgba(12,26,40,.75) 100%);
  }
  #setup .row { position:relative; z-index:1; display:flex; gap:14px; }
  #setup h2 { position:relative; z-index:1; color:var(--text); font-size:18px; letter-spacing:.06em; margin-bottom:4px; }
  .n-btn {
    width:96px; height:96px; font-size:17px; font-weight:700; font-family:var(--ui);
    background:var(--panel); color:var(--text); border:2px solid var(--rim); border-radius:14px; cursor:pointer;
    transition:all .15s;
  }
  .n-btn:hover { border-color:var(--amber); color:var(--amber); transform:translateY(-4px); }
  #setup .hint { position:relative; z-index:1; font-size:12px; color:var(--lo); margin-top:14px; }

  /* 玩家設定畫面：改名字、選真人／電腦難度 */
  #roster {
    position:fixed; inset:0; z-index:51; overflow:hidden; display:none;
    flex-direction:column; align-items:center; justify-content:center; gap:16px;
    background:#0C1A28;
  }
  #roster-bg {
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
    filter:brightness(.5); z-index:0;
  }
  #roster::after {
    content:''; position:absolute; inset:0; z-index:0;
    background:linear-gradient(180deg, rgba(12,26,40,.3) 0%, rgba(12,26,40,.4) 55%, rgba(12,26,40,.8) 100%);
  }
  #roster h2 { position:relative; z-index:1; color:var(--text); font-size:18px; letter-spacing:.06em; }
  #roster-list { position:relative; z-index:1; display:flex; flex-direction:column; gap:10px; }
  .roster-row {
    display:flex; align-items:center; gap:10px; background:var(--panel); border:1px solid var(--rim);
    border-radius:10px; padding:8px 12px; backdrop-filter:blur(6px);
  }
  .roster-avatar-picker { display:flex; gap:4px; }
  .roster-avatar-opt {
    width:32px; height:32px; border-radius:50%; object-fit:cover; border:2px solid var(--rim);
    cursor:pointer; opacity:.55; transition:all .12s;
  }
  .roster-avatar-opt:hover { opacity:.85; }
  .roster-avatar-opt.selected { border-color:var(--amber); opacity:1; box-shadow:0 0 0 2px rgba(240,160,32,.35); }
  .roster-name {
    width:110px; height:32px; background:var(--navy); border:1px solid var(--rim); color:var(--text);
    font-family:var(--ui); font-size:13px; padding:0 8px; border-radius:6px; outline:none;
  }
  .roster-name:focus { border-color:var(--amber); }
  .roster-mode {
    height:32px; background:var(--navy); border:1px solid var(--rim); color:var(--text);
    font-family:var(--ui); font-size:12.5px; padding:0 6px; border-radius:6px; outline:none;
  }
  .roster-years {
    position:relative; z-index:1; display:flex; align-items:center; gap:8px;
    font-size:13px; color:var(--text);
  }
  .roster-years select {
    height:32px; background:var(--navy); border:1px solid var(--rim); color:var(--text);
    font-family:var(--ui); font-size:12.5px; padding:0 8px; border-radius:6px; outline:none;
  }
  #roster-start {
    position:relative; z-index:1; height:46px; padding:0 30px; font-size:15px; font-weight:700; font-family:var(--ui);
    background:var(--amber); color:#20150a; border:none; border-radius:23px; cursor:pointer; margin-top:4px;
  }
  #roster-start:hover { transform:scale(1.04); }
  #roster .hint { position:relative; z-index:1; font-size:12px; color:var(--lo); }

  /* 自製確認視窗：取代原生 confirm()，原生對話框會讓瀏覽器跳出全螢幕模式 */
  #confirm-modal {
    position:fixed; inset:0; z-index:80; display:none;
    align-items:center; justify-content:center;
    background:rgba(12,26,40,.6); backdrop-filter:blur(3px);
  }
  .cm-card {
    background:var(--panel); border:1px solid var(--rim); border-radius:14px;
    padding:22px 26px; min-width:280px; max-width:360px;
    display:flex; flex-direction:column; gap:14px; backdrop-filter:blur(6px);
  }
  .cm-card p { font-size:14px; color:var(--text); line-height:1.5; }
  .cm-actions { display:flex; gap:10px; }
  .cm-actions button {
    flex:1; height:42px; font-size:13.5px; font-weight:700; font-family:var(--ui);
    border-radius:21px; cursor:pointer;
  }
  #cm-cancel { background:transparent; color:var(--lo); border:1px solid var(--rim); }
  #cm-ok { background:var(--amber); color:#20150a; border:none; }
  #cm-cancel:hover { border-color:var(--amber); color:var(--text); }
  #cm-ok:hover { transform:scale(1.03); }

  /* 遊戲結束結算畫面 */
  #gameover {
    position:fixed; inset:0; z-index:66; display:none;
    align-items:center; justify-content:center;
    background:rgba(12,26,40,.65); backdrop-filter:blur(4px);
  }
  .go-card {
    background:var(--panel); border:1px solid var(--rim); border-radius:14px;
    padding:26px 30px; min-width:300px; max-width:380px;
    display:flex; flex-direction:column; gap:10px; backdrop-filter:blur(6px);
  }
  .go-card h2 { color:var(--amber); font-size:17px; font-weight:700; margin-bottom:4px; text-align:center; }
  .go-row {
    display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:8px;
    background:#1C3450; border:1.5px solid var(--rim);
  }
  .go-row.go-first { border-color:var(--amber); background:rgba(240,160,32,.14); }
  .go-rank-num { font-size:15px; font-weight:900; color:var(--lo); width:18px; }
  .go-row.go-first .go-rank-num { color:var(--amber); }
  .go-avatar { width:32px; height:32px; border-radius:50%; object-fit:cover; border:1.5px solid #fff; }
  .go-total { margin-left:auto; color:#FFD54A; font-weight:700; font-size:14px; }
  #go-restart, #go-extend {
    margin-top:6px; height:44px; font-size:14px; font-weight:700; font-family:var(--ui);
    background:var(--amber); color:#20150a; border:none; border-radius:22px; cursor:pointer;
  }
  #go-extend { background:transparent; border:1.5px solid var(--amber); color:var(--amber); }
  #go-restart:hover, #go-extend:hover { transform:scale(1.03); }

  /* 存檔按鈕（人數選擇畫面） */
  .load-save-btn {
    position:relative; z-index:1; margin-top:8px; height:40px; padding:0 20px; font-size:13px; font-family:var(--ui);
    background:var(--panel); color:var(--text); border:1px solid var(--rim); border-radius:20px; cursor:pointer;
  }
  .load-save-btn:hover { border-color:var(--amber); }

  /* 設定選單（齒輪點開）：查自己的資產、音效、延長年數 */
  #settings-menu {
    position:fixed; inset:0; z-index:69; display:none;
    align-items:center; justify-content:center;
    background:rgba(12,26,40,.55); backdrop-filter:blur(3px);
  }
  .cfg-card {
    background:var(--panel); border:1px solid var(--rim); border-radius:14px;
    padding:22px 26px; min-width:280px; max-width:340px;
    display:flex; flex-direction:column; gap:12px; backdrop-filter:blur(6px);
  }
  .cfg-card h2 { color:var(--amber); font-size:16px; font-weight:700; text-align:center; }
  .cfg-label { font-size:11px; font-weight:600; letter-spacing:.06em; color:var(--lo); text-transform:uppercase; }
  .cfg-assets-player {
    display:flex; align-items:center; gap:8px; background:#1C3450; border:1.5px solid var(--rim);
    border-radius:8px; padding:8px 10px; margin-top:4px;
  }
  .cfg-assets-player img { width:30px; height:30px; border-radius:50%; object-fit:cover; }
  .cfg-assets-money { margin-left:auto; color:#FFD54A; font-weight:700; font-size:13px; }
  .cfg-assets-stalls { font-size:11.5px; color:var(--lo); margin-top:4px; line-height:1.5; }
  #cfg-mute-toggle, #cfg-extend, #cfg-close {
    height:42px; font-size:13.5px; font-weight:700; font-family:var(--ui); border-radius:21px; cursor:pointer;
  }
  #cfg-mute-toggle, #cfg-extend {
    background:transparent; border:1.5px solid var(--rim); color:var(--text);
  }
  #cfg-mute-toggle:hover, #cfg-extend:hover { border-color:var(--amber); }
  #cfg-close { background:var(--amber); color:#20150a; border:none; }
  #cfg-close:hover { transform:scale(1.03); }

  /* 延長年數小視窗 */
  #extend-years {
    position:fixed; inset:0; z-index:67; display:none;
    align-items:center; justify-content:center;
    background:rgba(12,26,40,.55); backdrop-filter:blur(3px);
  }
  .ey-card {
    background:var(--panel); border:1px solid var(--rim); border-radius:14px;
    padding:22px 26px; min-width:260px;
    display:flex; flex-direction:column; gap:10px; backdrop-filter:blur(6px);
  }
  .ey-card h3 { color:var(--amber); font-size:15px; font-weight:700; }
  .ey-cur { font-size:12.5px; color:var(--lo); }
  .ey-row { display:flex; align-items:center; gap:8px; font-size:14px; }
  .ey-row input {
    width:70px; height:32px; background:var(--navy); border:1px solid var(--rim); color:var(--text);
    font-family:var(--ui); font-size:14px; padding:0 8px; border-radius:6px; outline:none; text-align:center;
  }
  #ey-confirm, #ey-cancel {
    height:38px; font-size:13px; font-weight:700; font-family:var(--ui); border-radius:19px; cursor:pointer;
  }
  #ey-confirm { background:var(--amber); color:#20150a; border:none; }
  #ey-cancel { background:transparent; color:var(--lo); border:1px solid var(--rim); }

  /* 存檔選位／存檔詳細畫面（10 個檔案匣，仿桃鐵） */
  #save-slots, #save-detail {
    position:fixed; inset:0; z-index:68; display:none;
    align-items:center; justify-content:center;
    background:rgba(12,26,40,.7); backdrop-filter:blur(4px);
  }
  .ss-slots-card, .sd-card {
    background:var(--panel); border:1px solid var(--rim); border-radius:14px;
    padding:24px 28px; min-width:320px; max-width:420px; max-height:80vh; overflow-y:auto;
    display:flex; flex-direction:column; gap:10px; backdrop-filter:blur(6px);
  }
  .ss-slots-card h2, .sd-card h2 { color:var(--amber); font-size:16px; font-weight:700; text-align:center; }
  .save-slot {
    display:flex; flex-direction:column; align-items:flex-start; gap:2px;
    width:100%; padding:9px 12px; border-radius:8px; cursor:pointer; text-align:left;
    background:#1C3450; border:1.5px solid var(--rim); color:var(--text); font-family:var(--ui);
  }
  .save-slot:hover { border-color:var(--amber); }
  .save-slot-num { font-size:11px; color:var(--lo); font-weight:700; }
  .save-slot-names { font-size:13.5px; font-weight:700; }
  .save-slot-meta { font-size:11.5px; color:var(--lo); }
  .save-slot-empty { font-size:12.5px; color:var(--lo); font-style:italic; }
  #save-slots-back, #sd-back {
    margin-top:6px; height:40px; font-size:13px; font-family:var(--ui);
    background:transparent; color:var(--lo); border:1px solid var(--rim); border-radius:20px; cursor:pointer;
  }
  #sd-meta { font-size:12.5px; color:var(--lo); text-align:center; margin-top:-6px; }
  .sd-player {
    background:#1C3450; border:1.5px solid var(--rim); border-radius:8px; padding:8px 12px; font-size:13px;
  }
  .sd-player-head { display:flex; align-items:center; gap:8px; }
  .sd-player-head img { width:26px; height:26px; border-radius:50%; object-fit:cover; }
  .sd-player-money { margin-left:auto; color:#FFD54A; font-weight:700; font-size:12.5px; }
  .sd-player-stalls { font-size:11.5px; color:var(--lo); margin-top:4px; line-height:1.5; }
  .sd-actions { display:flex; flex-direction:column; gap:6px; margin-top:4px; }
  #sd-load {
    height:42px; font-size:13.5px; font-weight:700; font-family:var(--ui);
    background:var(--amber); color:#20150a; border:none; border-radius:21px; cursor:pointer;
  }
  #sd-delete {
    height:38px; font-size:12.5px; font-family:var(--ui);
    background:transparent; color:#E05050; border:1px solid #E05050; border-radius:19px; cursor:pointer;
  }

  /* 月份跳字：每月回合開始前，從右側滑入 → 中間停頓 → 往左滑出 */
  #month-banner {
    position:fixed; inset:0; z-index:60; overflow:hidden; pointer-events:none;
    opacity:0; visibility:hidden;
  }
  #month-banner.playing { opacity:1; visibility:visible; }
  #month-banner-img {
    position:absolute; inset:0; width:100%; height:100%;
    background-size:cover; background-position:center; filter:brightness(.5);
    opacity:0; transition:opacity .2s;
  }
  #month-banner.playing #month-banner-img { opacity:1; }
  .month-banner-text {
    position:absolute; top:50%; left:50%;
    transform:translate(120%, -50%);
    font-size:56px; font-weight:900; color:#fff; white-space:nowrap;
    -webkit-text-stroke:2px #d6336c; text-shadow:0 4px 18px rgba(0,0,0,.6);
  }
  #month-banner.playing .month-banner-text {
    animation:monthSlide 2.1s cubic-bezier(.22,.9,.32,1) forwards;
  }
  @keyframes monthSlide {
    0%   { transform:translate(120%, -50%); opacity:0; }
    22%  { transform:translate(-50%, -50%); opacity:1; }
    62%  { transform:translate(-50%, -50%); opacity:1; }
    100% { transform:translate(-220%, -50%); opacity:1; }
  }

  /* 物產／攤位購買面板 */
  #stall-shop {
    position:fixed; inset:0; z-index:65; display:none;
    align-items:center; justify-content:center;
    background:rgba(12,26,40,.55); backdrop-filter:blur(3px);
  }
  .ss-card {
    background:var(--panel); border:1px solid var(--rim); border-radius:14px;
    padding:22px 26px; min-width:280px; max-width:340px;
    display:flex; flex-direction:column; gap:10px; backdrop-filter:blur(6px);
  }
  .ss-card h3 { color:var(--amber); font-size:15px; font-weight:700; margin-bottom:4px; }
  .ss-check-row {
    display:flex; align-items:center; gap:8px; font-family:var(--ui); font-size:14px;
    padding:9px 12px; border-radius:8px; background:#1C3450; border:1.5px solid var(--rim);
    color:var(--text); cursor:pointer;
  }
  .ss-check-row:has(input:disabled) { opacity:.45; cursor:default; }
  .ss-check-row input[type=checkbox] { width:17px; height:17px; accent-color:var(--amber); cursor:pointer; }
  .ss-check-row input:disabled { cursor:default; }
  .ss-select-all { border-color:var(--amber); font-weight:700; color:var(--amber); }
  /* 鍵盤 focus 提示：整列（或按鈕）用同一套琥珀色外框，跟方向鍵移動 focus 的操作對應 */
  .ss-check-row:focus-within { border-color:var(--amber); background:rgba(240,160,32,.14); }
  .ss-check-row input:focus { outline:none; }
  #ss-confirm {
    margin-top:4px; font-family:var(--ui); font-size:14px; font-weight:700; padding:10px; border-radius:8px;
    background:var(--amber); color:#20150a; border:none; cursor:pointer;
  }
  #ss-confirm:hover { transform:scale(1.02); }
  #ss-confirm:focus, #ss-skip:focus { outline:2px solid #fff; outline-offset:2px; }
  #ss-skip {
    margin-top:2px; font-family:var(--ui); font-size:13px; padding:8px; border-radius:8px;
    background:transparent; border:1px solid var(--rim); color:var(--lo); cursor:pointer;
  }
  #ss-skip:hover { border-color:var(--amber); color:var(--text); }
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="hud">
  <div id="calendar">第 1 年　4 月</div>
  <div id="roll-info" style="display:none;font-size:13px;font-weight:700;color:var(--text);margin-bottom:8px;"></div>
  <div id="destination" style="display:none;font-size:13px;font-weight:700;color:#FFD54A;margin-bottom:8px;"></div>
  <div id="players"></div>
</div>

<div id="controls">
  <button id="btn-roll" disabled>🎲 擲骰</button>
  <button id="btn-zoom">🔍 全島 / 近景</button>
</div>

<div id="dice"></div>
<div id="branch-layer"></div>
<div id="toast"></div>

<div id="stall-shop">
  <div class="ss-card">
    <h3 id="ss-title"></h3>
    <div id="ss-list"></div>
    <button id="ss-confirm">確定購買</button>
    <button id="ss-skip">不買，繼續前進</button>
  </div>
</div>
<canvas id="minimap" width="190" height="218"></canvas>
<button id="btn-settings" title="設定">⚙️</button>
<button id="btn-mute" title="靜音切換">🔊</button>

<div id="month-banner">
  <div id="month-banner-img"></div>
  <div class="month-banner-text"></div>
</div>

<div id="splash">
  <img id="splash-bg" src="assets/screens/title.jpg" alt="">
  <div class="splash-title">
    <h1>小球貓電鐵</h1>
    <p class="subtitle">台灣版的鐵道大富翁</p>
  </div>
  <div id="splash-version">V0.65</div>
  <p class="splash-hint">按任意鍵或點擊畫面開始</p>
</div>

<div id="setup">
  <img id="setup-bg" src="assets/screens/setup.jpg" alt="">
  <h2>選擇對戰人數</h2>
  <div class="row">
    <button class="n-btn" data-n="2">2 人<br>對戰</button>
    <button class="n-btn" data-n="3">3 人<br>對戰</button>
    <button class="n-btn" data-n="4">4 人<br>對戰</button>
  </div>
  <button id="btn-load-save" class="load-save-btn">📂 讀取存檔</button>
  <p class="hint">同機輪流（hot-seat）・空白鍵擲骰・Z 或按鈕切換全島視角・滾輪縮放</p>
</div>

<div id="roster">
  <img id="roster-bg" src="assets/screens/setup.jpg" alt="">
  <h2>設定玩家</h2>
  <div id="roster-list"></div>
  <div class="roster-years">
    <span>遊戲年數：</span>
    <select id="roster-years-select">
      <option value="3">短局（3 年）</option>
      <option value="5" selected>標準（5 年）</option>
      <option value="10">長局（10 年）</option>
      <option value="custom">自訂</option>
    </select>
    <input type="number" id="roster-years-custom" min="1" max="99" value="5" style="display:none;">
  </div>
  <button id="roster-start">開始遊戲</button>
  <p class="hint">點大頭貼可任選角色；可自行改名；每位玩家可選真人或電腦（三種難度）</p>
</div>

<div id="confirm-modal">
  <div class="cm-card">
    <p id="cm-message"></p>
    <div class="cm-actions">
      <button id="cm-cancel">取消</button>
      <button id="cm-ok">確定</button>
    </div>
  </div>
</div>

<div id="gameover">
  <div class="go-card">
    <h2>🏁 遊戲結束！第 <span id="go-years"></span> 年結算</h2>
    <div id="go-rank"></div>
    <button id="go-extend">⏫ 延長遊戲，繼續玩</button>
    <button id="go-restart">再玩一次</button>
  </div>
</div>

<div id="settings-menu">
  <div class="cfg-card">
    <h2>⚙️ 設定</h2>
    <div>
      <div class="cfg-label">我的資產</div>
      <div id="cfg-assets"></div>
    </div>
    <button id="cfg-mute-toggle">🔊 靜音：關</button>
    <button id="cfg-extend">📅 變更遊戲年數</button>
    <button id="cfg-close">關閉</button>
  </div>
</div>

<div id="extend-years">
  <div class="ey-card">
    <h3>變更遊戲年數</h3>
    <p class="ey-cur">目前設定：<span id="ey-cur-total"></span> 年（現在第 <span id="ey-cur-year"></span> 年）</p>
    <div class="ey-row">
      <span>新的總年數</span>
      <input type="number" id="ey-input" min="1" max="99" value="5">
      <span>年</span>
    </div>
    <button id="ey-confirm">確定</button>
    <button id="ey-cancel">取消</button>
  </div>
</div>

<div id="save-slots">
  <div class="ss-slots-card">
    <h2 id="save-slots-title">讀取存檔</h2>
    <div id="save-slots-list"></div>
    <button id="save-slots-back">返回</button>
  </div>
</div>

<div id="save-detail">
  <div class="sd-card">
    <h2 id="sd-title"></h2>
    <p id="sd-meta"></p>
    <div id="sd-players"></div>
    <div class="sd-actions">
      <button id="sd-load">讀取這個存檔</button>
      <button id="sd-delete">刪除存檔</button>
      <button id="sd-back">返回列表</button>
    </div>
  </div>
</div>

<script src="map_data.js?v=71"></script>
<script src="src/data.js?v=71"></script>
<script src="src/audio.js?v=71"></script>
<script src="src/board.js?v=71"></script>
<script src="src/render.js?v=71"></script>
<script src="src/savegame.js?v=71"></script>
<script src="src/rules.js?v=71"></script>
<script src="src/ui.js?v=71"></script>
<script src="src/main.js?v=71"></script>
</body>
</html>
