<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小球貓電鐵｜捷徑卡片直升機動畫模擬 v0.4</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:"PingFang TC","Microsoft JhengHei",sans-serif;background:#173e5b}#game{width:100%;height:100%;display:block}#heli{position:fixed;z-index:10;width:108px;transform:translate(-50%,-62%);pointer-events:none;filter:drop-shadow(0 9px 5px #102d4288);opacity:0}#heli.show{opacity:1}#heli.fly{animation:bob .24s ease-in-out infinite alternate}@keyframes bob{to{margin-top:-9px;transform:translate(-50%,-62%) rotate(-5deg)}}#card{position:fixed;z-index:20;left:4%;top:5%;width:min(300px,43vw);padding:17px 19px;border:4px solid #fff4b0;border-radius:21px;background:linear-gradient(145deg,#266b99,#123751);box-shadow:0 9px 0 #0b2b4388;color:#fff;transform:translateY(-135%);opacity:0;transition:.42s}#card.show{transform:none;opacity:1}#card small{color:#ffe481;font-weight:900;letter-spacing:.15em}#card h1{margin:5px 0 2px;font-size:clamp(25px,3vw,39px)}#card p{margin:0;font-weight:800}.banner{position:fixed;z-index:20;left:50%;top:8%;transform:translateX(-50%) scale(.7);padding:11px 22px;border:3px solid #fff;border-radius:999px;background:#fffdf3;color:#183b55;box-shadow:0 5px #9acfe0;font-weight:900;white-space:nowrap;opacity:0;transition:.35s}.banner.show{transform:translateX(-50%) scale(1);opacity:1}#arrival{top:19%;font-size:clamp(21px,3vw,37px)}#ctl{position:fixed;z-index:30;right:16px;bottom:16px;width:270px;padding:14px;border:2px solid #65afd2;border-radius:16px;background:#102e49ee;color:#e8f8ff;box-shadow:0 10px 26px #081c2e99}#ctl h3{margin:0 0 6px;color:#ffdb64;font-size:15px}#ctl p{margin:0 0 10px;color:#a8cbdc;font-size:12px;line-height:1.45}select,button{width:100%;font:800 14px inherit}select{padding:8px;margin-bottom:8px;border:2px solid #65afd2;border-radius:8px;background:#173e5a;color:#fff}button{padding:10px;border:3px solid #fff4ae;border-radius:10px;background:linear-gradient(#ffdb64,#f2a11e);box-shadow:0 4px #ad6b0a;color:#3c2900;cursor:pointer}button:active{transform:translateY(3px);box-shadow:0 1px #ad6b0a}@media(max-width:700px){#ctl{right:8px;bottom:8px;width:215px}#heli{width:84px}}
</style></head><body>
<canvas id="game"></canvas><img id="heli" src="../圖片/玩家icon/直升機.png" alt="捷徑直升機"><section id="card"><small>移動卡片</small><h1>🚁 蘇花捷徑</h1><p>直接前往花蓮</p></section><div id="use" class="banner">探險家使用「蘇花捷徑」！</div><div id="arrival" class="banner">🎉 抵達花蓮！</div><aside id="ctl"><h3>捷徑卡片動畫 v0.4</h3><p>使用遊戲進行中的完整棋盤：所有站點、路線與圖示皆由正式渲染器繪製。</p><select id="origin"><option value="tr_taipei">台北</option><option value="tr_taichung" selected>台中</option><option value="tr_tainan">台南</option><option value="tr_kaohsiung">高雄</option></select><button id="play">🚁 使用蘇花捷徑</button></aside>
<script src="map_data.js"></script><script src="src/data.js"></script><script>window.Game={players:[],cur:0,state:'shortcut',month:6,destination:'tr_hualien',curPlayer(){return this.players[0]}};</script><script src="src/render-v1.17.js"></script><script>
const $=id=>document.getElementById(id),heli=$('heli');let pos=null,run=false,startT=0,start=null,target=null,duration=0;
Data.load();Render.init($('game'));Render.onFrame=()=>{if(!pos)return;const s=Render.worldToCss(pos.x,pos.y);heli.style.left=s.x+'px';heli.style.top=s.y+'px'};
function reset(){run=false;start=Data.stations.get($('origin').value);target=Data.stations.get('tr_hualien');pos={x:start.x,y:start.y};Render.snapTo(start.x,start.y);Render.cam.tscale=Render.ZOOM_NEAR;heli.classList.remove('show','fly');['card','use','arrival'].forEach(id=>$(id).classList.remove('show'))}
function play(){reset();const dist=Math.hypot(target.x-start.x,target.y-start.y);duration=Math.max(1800,dist/210*1000);$('card').classList.add('show');setTimeout(()=>$('use').classList.add('show'),280);setTimeout(()=>{run=true;startT=performance.now();heli.classList.add('show','fly');tick()},760)}
function tick(){const t=Math.min(1,(performance.now()-startT)/duration);pos={x:start.x+(target.x-start.x)*t,y:start.y+(target.y-start.y)*t};Render.follow(pos.x,pos.y);if(t<1){requestAnimationFrame(tick);return}run=false;heli.classList.remove('fly');pos={x:target.x,y:target.y};Render.snapTo(target.x,target.y);$('arrival').classList.add('show')}
$('play').onclick=play;$('origin').onchange=reset;reset();
</script></body></html>
