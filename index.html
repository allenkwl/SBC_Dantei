<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小球貓電鐵</title>
<style>
  html,body{height:100%;margin:0;display:grid;place-items:center;
            background:#0C1A28;color:#cfe6f5;
            font-family:"PingFang TC","Microsoft JhengHei",sans-serif}
  a{color:#ffd451}
</style>
</head>
<body>
<p id="msg">正在載入小球貓電鐵……</p>
<script>
// 這一頁刻意不寫死版號（除了下面那個備援），所以就算被瀏覽器快取住也不會過期：
// 每次載入都去問 latest.json 現在最新是哪一版，而那個請求帶了時間戳，一定是新的。
(function () {
  var fallback = 'game-web/%E5%B0%8F%E7%90%83%E8%B2%93%E9%9B%BB%E9%90%B5v2.38.html';
  function go(url) { location.replace(url); }
  fetch('latest.json?t=' + Date.now(), {cache: 'no-store'})
    .then(function (r) { return r.json(); })
    .then(function (d) { go('game-web/' + encodeURIComponent(d.file)); })
    .catch(function () { go(fallback); });   // 抓不到就走備援，至少進得去
})();
</script>
<noscript><a href="game-web/%E5%B0%8F%E7%90%83%E8%B2%93%E9%9B%BB%E9%90%B5v2.38.html">請點這裡進入遊戲</a></noscript>
</body>
</html>
